name: Secret Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  scan-secrets:
    name: Scan for secrets and sensitive information
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG_PATH: .gitleaks.toml

      - name: Check for common sensitive patterns
        run: |
          echo "Checking for common sensitive patterns..."
          
          # Check for API keys patterns
          if grep -r -E "(api[_-]?key|apikey|api_key)" --include="*.yml" --include="*.yaml" --include="*.md" --include="*.json" . | grep -v ".git" | grep -v ".gitleaks" | grep -v "README.md" | grep -v "example\|sample\|placeholder\|xxx\|your-"; then
            echo "⚠️  Warning: Potential API key found"
            exit 1
          fi
          
          # Check for webhook URLs with tokens
          if grep -r -E "webhook.*https?://[a-zA-Z0-9_-]+" --include="*.yml" --include="*.yaml" . | grep -v ".git" | grep -v "example\|sample\|placeholder"; then
            echo "⚠️  Warning: Potential webhook URL with token found"
            exit 1
          fi
          
          # Check for Slack tokens
          if grep -r -E "xox[baprs]-[0-9A-Za-z-]{10,}" --include="*.yml" --include="*.yaml" . | grep -v ".git" | grep -v "example\|sample\|placeholder"; then
            echo "⚠️  Warning: Potential Slack token found"
            exit 1
          fi
          
          # Check for AWS keys
          if grep -r -E "AKIA[0-9A-Z]{16}" --include="*.yml" --include="*.yaml" . | grep -v ".git" | grep -v "example\|sample\|placeholder"; then
            echo "⚠️  Warning: Potential AWS access key found"
            exit 1
          fi
          
          echo "✅ No obvious sensitive patterns found"

