# Gitleaks configuration for Dify Use Case Playground
# This file configures what secrets to detect and what to ignore

title = "Dify Use Case Playground Secret Detection"

[extend]
# Use default gitleaks rules
useDefault = true

[allowlist]
description = "Allowlist for false positives"
paths = [
  '''\.gitleaks\.toml''',
  '''\.gitignore''',
  '''README\.md''',
  '''LICENSE''',
  '''\.github/workflows/.*\.yml''',
]

commits = [
  # Allow commits that are just documentation updates
  '''^docs?\(.*\):.*''',
]

regexes = [
  # Allow example/placeholder patterns
  '''example.*key''',
  '''placeholder.*token''',
  '''your-.*-key''',
  '''xxx.*xxx''',
  '''sample.*secret''',
  # Allow marketplace plugin identifiers (these are public identifiers)
  '''marketplace_plugin_unique_identifier''',
  # Allow version numbers that might look like tokens
  '''version:\s*[\d\.]+''',
]

# Note: regexTarget removed due to configuration format issues
# The general allowlist regexes above should cover README files

